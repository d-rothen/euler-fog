[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "euler-preprocess"
version = "3.13.0"
description = "Physics-based preprocessing (fog, etc.) for RGB+depth datasets"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Daniel Rothenpieler", email = "rothenpielerdaniel@gmail.com" },
]
dependencies = [
  "numpy",
  "Pillow",
  "euler-loading",
]

[project.optional-dependencies]
gpu = [
  "torch",
]
progress = [
  "tqdm",
]

[project.scripts]
euler-preprocess = "euler_preprocess.cli:main"

[tool.setuptools.packages.find]
include = ["euler_preprocess", "euler_preprocess.*"]
